name: Loop Eyes checks
on: [push, pull_request, workflow_dispatch]
defaults:
  run:
    working-directory: loop-eyes
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test.js
      - run: bash -n install.sh uninstall.sh scripts/loop-eyes-install scripts/loop-eyes-uninstall recipe/build.sh
      - name: System Qt compile check
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
