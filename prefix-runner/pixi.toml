# Pixi provides the build tooling (cmake, ninja, extra-cmake-modules).
# Qt 6 and KDE Frameworks 6 (KRunner, I18n, CoreAddons) must come from your
# distro: KF6 is not packaged on conda-forge, and the plugin is loaded into the
# system krunner/plasmashell, so it has to link their exact Qt/KF6 anyway.
# On Arch: sudo pacman -S --needed qt6-base krunner ki18n kcoreaddons

[workspace]
name = "prefixdev-runner"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
cmake = ">=3.22"
ninja = "*"
extra-cmake-modules = ">=6.0"

[activation.env]
# Use the system compiler and system Qt/KF6, never anything from the pixi env.
CC = "/usr/bin/cc"
CXX = "/usr/bin/c++"
CMAKE_PREFIX_PATH = "/usr"

[tasks]
configure = "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON -DECM_DIR=$CONDA_PREFIX/share/ECM/cmake"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure -LE online", depends-on = ["build"] }
test-online = { cmd = "QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure -L online", depends-on = ["build"] }
install = { cmd = "sudo $CONDA_PREFIX/bin/cmake --install build", depends-on = ["build"] }
uninstall = "sudo xargs rm -fv < build/install_manifest.txt"
# KRunner restarts on the next Alt+Space; plasmashell reloads Kickoff's search.
restart = "sh -c 'kquitapp6 krunner >/dev/null 2>&1; setsid -f plasmashell --replace >/dev/null 2>&1'"
clean = "rm -rf build"
